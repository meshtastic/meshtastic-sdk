#
# CI-specific Gradle properties.
#
# Copied to ~/.gradle/gradle.properties by the gradle-setup composite action,
# overriding dev-oriented values in the repo-root gradle.properties.
#

# ── Daemon ────────────────────────────────────────────────────────────
org.gradle.daemon=false

# ── Memory ────────────────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvm.options=-Xmx2g -XX:+UseParallelGC

# ── Parallelism ───────────────────────────────────────────────────────
org.gradle.parallel=true
org.gradle.workers.max=4

# ── Caching & Configuration ──────────────────────────────────────────
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=false
org.gradle.vfs.watch=false

# ── Kotlin ────────────────────────────────────────────────────────────
kotlin.incremental=false
kotlin.code.style=official

# ── Misc ─────────────────────────────────────────────────────────────
org.gradle.welcome=never
