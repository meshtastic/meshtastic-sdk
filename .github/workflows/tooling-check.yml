name: tooling-check

on:
  pull_request:
    paths:
      - '.github/**'
      - '.githooks/**'
  push:
    branches: [ main ]
    paths:
      - '.github/**'
      - '.githooks/**'

concurrency:
  group: tooling-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tooling-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck jq

      - name: Install yq
        run: |
          YQ_VERSION=v4.44.3
          sudo wget -qO /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq

      - name: Install npm tools
        run: npm install -g markdownlint-cli ajv-cli

      - name: Install actionlint
        run: |
          ACTIONLINT_VERSION=1.7.12
          curl -sSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz
          sudo mv actionlint /usr/local/bin/actionlint

      - name: Run tooling checks
        run: bash .github/tooling/check.sh
