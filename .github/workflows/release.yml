name: Release

# Release pipeline. See docs/release-runbook.md.
#
# Triggers:
#   - Tag push (vX.Y.Z, stable only) — automatic publish.
#   - workflow_dispatch — manual fallback, dry-runs, and pre-release tags
#     (vX.Y.Z-rcN). Pre-release tags deliberately do NOT auto-publish; see
#     docs/release-runbook.md §Release candidates.
#
# Pre-flight (done before tagging):
#   - main is green
#   - CHANGELOG.md [Unreleased] section is finalized
#   - Tag signed and pushed: git tag -s vX.Y.Z -m "vX.Y.Z" && git push --tags

on:
  push:
    tags:
      # Stable tags only. A vX.Y.Z-rcN tag does NOT match and will not publish —
      # publish rcs via workflow_dispatch instead (v0.1.0-rc1 once silently
      # did nothing because of this pattern; the exclusion is now intentional).
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0 or 0.1.0-rc2). Must match a pushed tag vX.Y.Z or vX.Y.Z-rcN.'
        required: true
        type: string
      dry_run:
        description: 'If true, build artifacts but skip publish.'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GRADLE_CACHE_URL: ${{ secrets.GRADLE_CACHE_URL }}
  GRADLE_CACHE_USERNAME: ${{ secrets.GRADLE_CACHE_USERNAME }}
  GRADLE_CACHE_PASSWORD: ${{ secrets.GRADLE_CACHE_PASSWORD }}

jobs:
  publish:
    name: Publish ${{ inputs.version || github.ref_name }}
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Resolve version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "ref=refs/tags/v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            tag="${GITHUB_REF_NAME}"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
            echo "ref=${GITHUB_REF}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout tag v${{ steps.ver.outputs.version }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ steps.ver.outputs.ref }}
          submodules: recursive
          fetch-depth: 0  # axion-release reads tags

      # The release job cross-compiles every Kotlin/Native target; without
      # this cache each release run re-downloads the konan toolchain and
      # rebuilds dependency klibs from scratch (the CI test jobs have had
      # this cache all along — v0.1.0's first attempt ran >1h cold).
      - name: Cache Konan
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml','gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            konan-${{ runner.os }}-

      # Cap build memory below the macOS runner's budget. The project
      # gradle.properties asks for -Xmx4g and full parallelism, which — plus
      # the Kotlin daemon and konan compilers — swap-thrashes the runner.
      # GRADLE_USER_HOME properties take precedence over the project's.
      - name: Cap Gradle memory for the runner
        run: |
          mkdir -p ~/.gradle
          {
            echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"
            echo "org.gradle.workers.max=2"
            echo "kotlin.daemon.jvmargs=-Xmx2g"
          } >> ~/.gradle/gradle.properties

      - uses: ./.github/actions/gradle-setup
        with:
          cache_read_only: 'true'
          gradle_encryption_key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Verify version matches tag
        run: |
          # axion's currentVersion prints "Project version: X.Y.Z" (plus a
          # blank line under -q); extract the bare version before comparing.
          actual=$(./gradlew -q currentVersion | sed -n 's/^Project version: //p' | tail -1)
          if [[ "$actual" != "${{ steps.ver.outputs.version }}" ]]; then
            echo "::error::Tag v${{ steps.ver.outputs.version }} resolves to '$actual' (expected ${{ steps.ver.outputs.version }})"
            exit 1
          fi

      # Samples are excluded: they are CI-gated on every PR and are not
      # published, and their RELEASE-mode iOS framework links run the
      # Kotlin/Native devirtualization pass, which OOMs the 7GB macOS
      # runner (v0.1.0 attempt 2 died there). -x also drops tasks
      # reachable only through the excluded ones (the link tasks).
      - name: Build all artifacts
        run: >
          ./gradlew assemble
          -x :samples:cli:assemble
          -x :samples:parity-app:assemble
          -x :samples:parity-android-app:assemble

      - name: Run gate
        run: >
          ./gradlew check
          -x :samples:cli:check
          -x :samples:parity-app:check
          -x :samples:parity-android-app:check

      - name: Check Maven Central state
        # Probe whether this version is already on Maven Central. If it is,
        # the publish step below skips — Sonatype rejects re-uploads with
        # "component already exists", which would otherwise turn a re-run
        # after a partial failure (workflow died after a successful publish)
        # into a hard failure. All sdk-* artifacts publish together in one
        # Central Portal deployment, so sdk-core's POM is an accurate proxy
        # for the whole release.
        id: mc_check
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          # `|| true`: a transient probe failure must not kill the run —
          # treating it as "not published" just means we attempt the
          # publish, which is today's behavior.
          HTTP=$(curl -sS -o /dev/null -w "%{http_code}" \
            "https://repo1.maven.org/maven2/org/meshtastic/sdk-core/$VERSION/sdk-core-$VERSION.pom" || true)
          echo "Maven Central POM probe for sdk-core $VERSION: HTTP $HTTP"
          if [ "$HTTP" = "200" ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VERSION is already on Maven Central — publish step will skip (idempotent re-run)."
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Maven Central
        if: ${{ inputs.dry_run != true && steps.mc_check.outputs.already_published == 'false' }}
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache

      - name: Dry-run summary
        if: ${{ inputs.dry_run == true }}
        run: echo "Dry run complete; artifacts built but not published."
