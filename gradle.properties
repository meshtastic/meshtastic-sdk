org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
# Configuration cache (Gradle 9 stable) ? major wall-clock win; keep parallel enabled.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
# Explicit: configure-on-demand is incompatible with isolated projects and config-cache hygiene.
org.gradle.configureondemand=false

# Android (AGP 9) ? explicit defaults. AndroidX is required under AGP 9; the
# non-transitive R class flag is the new default but we pin it for clarity.
android.useAndroidX=true
android.nonTransitiveRClass=true

