# Detekt configuration for meshtastic-sdk.
#
# Built upon detekt's default config (`buildUponDefaultConfig = true` in
# build.gradle.kts). Only project-specific deviations live here.
#
# Compose-aware rules are provided by io.nlopez.compose.rules:detekt
# (added via `detektPlugins(...)` in the root build.gradle.kts subprojects
# block). That plugin handles @Composable naming, recomposition pitfalls,
# modifier ordering, etc. — so we do NOT special-case Composable here.

config:
  validation: true
  warningsAsErrors: false
  checkExhaustiveness: false

processors:
  active: true

console-reports:
  active: true

complexity:
  active: true
  CyclomaticComplexMethod:
    allowedComplexity: 20
  LongMethod:
    allowedLines: 80
  LongParameterList:
    allowedFunctionParameters: 8
    allowedConstructorParameters: 8
  TooManyFunctions:
    allowedFunctionsPerClass: 30
    allowedFunctionsPerInterface: 20
    allowedFunctionsPerObject: 30

style:
  MagicNumber:
    active: false
  WildcardImport:
    active: true
    excludes: ['**/test/**', '**/*Test.kt', '**/*Spec.kt']
  ReturnCount:
    max: 8
  MaxLineLength:
    maxLineLength: 120
    excludePackageStatements: true
    excludeImportStatements: true
    excludeCommentStatements: true
  UnusedParameter:
    allowedNames: '(_|ignored|expected|rest|args)'
  ForbiddenImport:
    # Architecture invariants enforced per ADR-008.
    #
    # 1. ADR-002 forbids shared-state synchronization primitives in engine
    #    paths — the engine is a single-writer actor. The two existing
    #    atomicfu sites are documented boundary handles, not engine state.
    # 2. ADR-005 forbids kotlin.Result in public API; engine code shouldn't
    #    import it either, to keep us honest at the boundary.
    active: true
    forbiddenImports:
      - 'kotlinx.io.Buffer'                                # one byte vocabulary: okio (api-reference § API conventions)
      - 'kotlinx.io.bytestring.ByteString'                 # one byte vocabulary: okio
      - 'kotlinx.coroutines.sync.Mutex'                    # ADR-002: single-writer actor; no mutexes
      - 'kotlinx.coroutines.sync.Semaphore'                # ADR-002: single-writer actor; no semaphores
      - 'java.util.concurrent.locks.ReentrantLock'         # ADR-002: single-writer actor; no locks
      - 'kotlin.Result'                                    # ADR-005: forbidden in public API

naming:
  # detekt-compose-rules adds Compose-specific rules but does not disable
  # detekt's built-in FunctionNaming. PascalCase @Composable functions are
  # idiomatic; exempt them here.
  FunctionNaming:
    ignoreAnnotated: ['Composable']

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: true
    ignoredExceptionTypes:
      - InterruptedException
      - NumberFormatException
      - ParseException
      - MalformedURLException
