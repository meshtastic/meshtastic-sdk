# Codecov configuration — https://docs.codecov.com/docs/codecov-yaml
#
# Coverage is measured by Kover on the JVM target only (Kover instruments
# JVM/Android bytecode; Native/iOS execution is not counted). Reports are
# the project status GATES on regression (target: auto, ±1% tolerance); the
# patch status stays advisory to avoid blocking small PRs. See docs/ci-cd.md.
coverage:
  precision: 2
  round: down
  range: "60...100"
  status:
    project:
      default:
        target: auto         # gate: fail if overall coverage regresses
        threshold: 1%        # tolerate ≤1% dips (rounding, flaky lines)
        informational: false
    patch:
      default:
        informational: true  # advisory only — don't block small PRs on patch noise

comment:
  layout: "reach, diff, flags, components"
  require_changes: true

# Exclude generated, test, sample, and API-dump sources from coverage.
ignore:
  - "**/build/**"
  - "**/api/**"
  - "**/*Test*.kt"
  - "**/test/**"
  - "samples/**"
