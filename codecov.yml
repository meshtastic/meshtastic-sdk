# Codecov configuration — https://docs.codecov.com/docs/codecov-yaml
#
# Coverage is measured by Kover on the JVM target only (Kover instruments
# JVM/Android bytecode; Native/iOS execution is not counted). Reports are
# currently INFORMATIONAL (non-blocking) — a koverVerify threshold gate
# will be added once a baseline is established. See docs/ci-cd.md.
coverage:
  precision: 2
  round: down
  range: "60...100"
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment:
  layout: "reach, diff, flags, components"
  require_changes: true

# Exclude generated, test, sample, and API-dump sources from coverage.
ignore:
  - "**/build/**"
  - "**/api/**"
  - "**/*Test*.kt"
  - "**/test/**"
  - "samples/**"
